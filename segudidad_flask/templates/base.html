<!DOCTYPE html>
<html>
<head>
    <title>{% block title %}Mi Sistema{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <nav>
    {% block nav %}
        <a href="{{ url_for('users.index') }}">Inicio</a>
        {% if current_user.is_authenticated %}
                | <a href="{{ url_for('users.profile', id=current_user.id) }}">Mi perfil</a>
        | Hola, {{ current_user.username|capitalize }}
        | <a href="{{ url_for('users.logout') }}">Cerrar sesión</a>
    {% else %}
        | <a href="{{ url_for('users.login') }}">Iniciar sesión</a>
        | <a href="{{ url_for('users.register') }}">Registrarse</a>
        {% endif %}
    {% endblock %}
</nav>


    {% include "mensajes.html" %}

    {% block content %}{% endblock %}
</body>
</html>
