{% extends "base.html" %}

{% block title %}Perfil{% endblock %}

{% block content %}
<h1>Perfil de {{ user.username|capitalize }}</h1>
<p>Correo: {{ user.email }}</p>

{% if session['user_id'] == user.id %}
    <a href="{{ url_for('users.edit_profile', id=user.id) }}">Editar perfil</a>

    <form method="POST" action="{{ url_for('users.delete_profile', id=user.id) }}"
          onsubmit="return confirm('¿Seguro que quieres eliminar tu cuenta?');">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit">Eliminar cuenta</button>
    </form>
{% endif %}

<p><a href="{{ url_for('users.index') }}">Volver</a></p>
{% endblock %}
